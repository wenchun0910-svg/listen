<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國語聽寫機</title>
    <!-- 引入 Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- 引入 Alpine.js (必須放在 head 且加入 defer) -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <style>
        /* 隱藏未初始化的 Alpine 元素，避免畫面閃爍 */
        [x-cloak] { display: none !important; }
    </style>
</head>
<body class="bg-gray-100 min-h-screen font-sans text-gray-800">

    <!-- 應用程式根容器，綁定 Alpine.js 資料模型 -->
    <div x-data="dictationApp()" x-cloak class="max-w-5xl mx-auto p-4 md:p-6">
        
        <!-- 頂部導覽列 -->
        <header class="flex justify-between items-center bg-white shadow-md rounded-xl p-4 mb-6">
            <h1 class="text-2xl font-bold text-blue-600 flex items-center gap-2">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-8 w-8" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253" />
                </svg>
                國語聽寫機
            </h1>
            <div class="flex gap-2">
                <!-- 老師管理模式下顯示修改密碼按鈕 -->
                <button x-show="appMode === 'teacher'" @click="showPasswordChangeModal = true" class="px-4 py-2 bg-yellow-500 hover:bg-yellow-600 text-white rounded-lg font-medium transition">
                    修改密碼
                </button>
                <button @click="toggleMode()" class="px-4 py-2 bg-indigo-500 hover:bg-indigo-600 text-white rounded-lg font-medium transition shadow">
                    <span x-text="appMode === 'student' ? '老師管理' : '返回學生模式'"></span>
                </button>
            </div>
        </header>

        <!-- 學生模式：選擇課文與聽寫介面 -->
        <main x-show="appMode === 'student'" class="space-y-6">
            
            <!-- 課文列表 -->
            <div x-show="!isDictating" class="bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-bold mb-4 text-gray-700">請選擇課文：</h2>
                <div x-show="lessons.length === 0" class="text-center py-10 text-gray-400 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200">
                    尚無課文資料，請由老師管理介面新增。
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 gap-4">
                    <template x-for="lesson in lessons" :key="lesson.id">
                        <button @click="startDictation(lesson)" class="p-4 border-2 border-blue-200 bg-blue-50 rounded-xl hover:bg-blue-100 hover:border-blue-300 transition text-lg font-semibold text-blue-800 shadow-sm flex flex-col items-center gap-2">
                            <span x-text="lesson.title"></span>
                            <span class="text-sm font-normal text-gray-500" x-text="`共 ${lesson.words.length} 個圈詞`"></span>
                        </button>
                    </template>
                </div>
            </div>

            <!-- 聽寫進行中介面 -->
            <div x-show="isDictating" class="bg-white p-8 rounded-xl shadow-md text-center max-w-2xl mx-auto border-t-4 border-blue-500">
                <div class="flex justify-between items-center mb-6">
                    <h2 class="text-2xl font-bold text-gray-700" x-text="currentLesson?.title"></h2>
                    <span class="text-lg font-medium bg-blue-100 text-blue-800 py-1 px-3 rounded-full" x-text="`第 ${currentWordIndex + 1} / ${currentWords.length} 題`"></span>
                </div>
                
                <div class="my-8">
                    <button @click="playWordAudio()" class="w-24 h-24 bg-blue-500 hover:bg-blue-600 text-white rounded-full shadow-lg flex items-center justify-center mx-auto transition transform hover:scale-105">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-12 w-12" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.536 8.464a5 5 0 010 7.072m2.828-9.9a9 9 0 010 12.728M5 10v4a2 2 0 002 2h2.586l4.707 4.707A.996.996 0 0015 20V4a.996.996 0 00-1.707-.707L9.586 10H7a2 2 0 00-2 2z" />
                        </svg>
                    </button>
                    <p class="mt-4 text-gray-500 font-medium">點擊播放語音</p>
                </div>

                <div class="space-y-4">
                    <input type="text" x-model="studentAnswer" @keyup.enter="checkAnswer()" placeholder="請輸入聽到的圈詞..." class="w-full text-center text-3xl p-4 border-2 border-gray-300 rounded-xl focus:outline-none focus:border-blue-500 focus:ring-4 focus:ring-blue-200 transition">
                    
                    <button @click="checkAnswer()" class="w-full py-4 bg-green-500 hover:bg-green-600 text-white text-xl font-bold rounded-xl shadow-md transition">
                        送出答案
                    </button>
                </div>

                <div class="mt-6 flex justify-between">
                    <button @click="endDictation()" class="text-gray-500 hover:text-gray-700 font-medium px-4 py-2">
                        放棄並返回
                    </button>
                </div>
            </div>
        </main>

        <!-- 老師管理模式 -->
        <main x-show="appMode === 'teacher'" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            
            <!-- 表單區塊 (新增/編輯) -->
            <div class="lg:col-span-1 bg-white p-6 rounded-xl shadow-md h-fit">
                <h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2" x-text="isEditing ? '編輯課文' : '新增課文'"></h2>
                <form @submit.prevent="saveLesson" class="space-y-4">
                    <div>
                        <label class="block text-gray-700 font-medium mb-1">課文標題</label>
                        <input type="text" x-model="formData.title" required placeholder="例如：第一課 春天來了" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
                    </div>
                    <div>
                        <label class="block text-gray-700 font-medium mb-1">圈詞 (批次匯入)</label>
                        <p class="text-xs text-gray-500 mb-2">請以「空白」或「換行」來分隔每個圈詞。</p>
                        <textarea x-model="formData.wordsRaw" required rows="6" placeholder="春天&#10;花朵&#10;蝴蝶" class="w-full p-2 border border-gray-300 rounded-lg focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200"></textarea>
                    </div>
                    <div class="flex gap-2 pt-2">
                        <button type="submit" class="flex-1 bg-indigo-500 hover:bg-indigo-600 text-white font-bold py-2 px-4 rounded-lg transition-colors" x-text="isEditing ? '儲存修改' : '新增課文'"></button>
                        <button type="button" x-show="isEditing" @click="resetForm()" class="flex-1 bg-gray-200 hover:bg-gray-300 text-gray-700 font-bold py-2 px-4 rounded-lg transition-colors">
                            取消
                        </button>
                    </div>
                </form>
            </div>

            <!-- 管理列表區塊 -->
            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-md">
                <h2 class="text-xl font-bold mb-4 text-gray-700 border-b pb-2">現有課文管理</h2>
                
                <div x-show="lessons.length === 0" class="text-center py-10 text-gray-400 bg-gray-50 rounded-xl border-2 border-dashed border-gray-200">
                    尚無資料，請由左側新增課文。
                </div>

                <div class="space-y-3">
                    <template x-for="lesson in lessons" :key="lesson.id">
                        <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center p-4 border border-gray-200 rounded-lg hover:bg-gray-50">
                            <div>
                                <h3 class="text-lg font-bold text-gray-800" x-text="lesson.title"></h3>
                                <p class="text-sm text-gray-500 mt-1" x-text="lesson.words.join('、')"></p>
                            </div>
                            <div class="flex gap-2 mt-3 sm:mt-0">
                                <button @click="editLesson(lesson)" class="px-3 py-1 bg-blue-100 text-blue-700 hover:bg-blue-200 rounded font-medium transition">編輯</button>
                                <button @click="deleteLesson(lesson.id)" class="px-3 py-1 bg-red-100 text-red-700 hover:bg-red-200 rounded font-medium transition">刪除</button>
                            </div>
                        </div>
                    </template>
                </div>
            </div>
        </main>

        <!-- 管理員登入 Modal -->
        <div x-show="showLoginModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm" x-cloak>
            <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm" @click.away="showLoginModal = false">
                <h3 class="text-xl font-bold text-gray-800 mb-4 text-center">老師管理登入</h3>
                <input type="password" x-model="loginInput" @keyup.enter="verifyLogin()" placeholder="請輸入管理員密碼" class="w-full p-3 border border-gray-300 rounded-lg mb-4 text-center focus:outline-none focus:border-indigo-500 focus:ring-2 focus:ring-indigo-200">
                <p x-show="loginError" class="text-red-500 text-sm mb-4 text-center">密碼錯誤，請重試。</p>
                <div class="flex gap-2">
                    <button @click="showLoginModal = false" class="flex-1 py-2 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300 transition">取消</button>
                    <button @click="verifyLogin()" class="flex-1 py-2 bg-indigo-500 text-white rounded-lg font-medium hover:bg-indigo-600 transition">登入</button>
                </div>
            </div>
        </div>

        <!-- 修改密碼 Modal -->
        <div x-show="showPasswordChangeModal" class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50 backdrop-blur-sm" x-cloak>
            <div class="bg-white p-6 rounded-xl shadow-xl w-full max-w-sm" @click.away="showPasswordChangeModal = false">
                <h3 class="text-xl font-bold text-gray-800 mb-4 text-center">修改管理員密碼</h3>
                <input type="password" x-model="newPasswordInput" @keyup.enter="updatePassword()" placeholder="請輸入新密碼" class="w-full p-3 border border-gray-300 rounded-lg mb-4 text-center focus:outline-none focus:border-yellow-500 focus:ring-2 focus:ring-yellow-200">
                <div class="flex gap-2">
                    <button @click="showPasswordChangeModal = false; newPasswordInput = ''" class="flex-1 py-2 bg-gray-200 text-gray-700 rounded-lg font-medium hover:bg-gray-300 transition">取消</button>
                    <button @click="updatePassword()" class="flex-1 py-2 bg-yellow-500 text-white rounded-lg font-medium hover:bg-yellow-600 transition">確認修改</button>
                </div>
            </div>
        </div>

    </div>

    <!-- Firebase SDK & 應用程式邏輯 -->
    <script type="module">
        // 1. 引入 Firebase 模組
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getFirestore, collection, addDoc, doc, updateDoc, deleteDoc, onSnapshot, setDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // ==========================================
        // ⚠️ 請將以下設定替換為您的 Firebase 專案設定 ⚠️
        // ==========================================
    const firebaseConfig = {
  apiKey: "AIzaSyCd3tqkmxYzFC30hsj63WGLrCmbgoHKrN4",
  authDomain: "listen-e8f45.firebaseapp.com",
  projectId: "listen-e8f45",
  storageBucket: "listen-e8f45.firebasestorage.app",
  messagingSenderId: "835797547922",
  appId: "1:835797547922:web:70ac8c25e932a53ef29f4b"
};

        // 初始化 Firebase
        const app = initializeApp(firebaseConfig);
        const db = getFirestore(app);

        // 初始化 Web Audio API (用於生成音效)
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        // 音效播放函數：利用純程式碼生成音效，不依賴 mp3
        function playSound(type) {
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            const oscillator = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            oscillator.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'success') {
                oscillator.type = 'sine';
                oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime); // C5
                oscillator.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.5);
            } else if (type === 'error') {
                oscillator.type = 'sawtooth';
                oscillator.frequency.setValueAtTime(150, audioCtx.currentTime);
                oscillator.frequency.linearRampToValueAtTime(100, audioCtx.currentTime + 0.3);
                gainNode.gain.setValueAtTime(0.5, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
                oscillator.start(audioCtx.currentTime);
                oscillator.stop(audioCtx.currentTime + 0.3);
            }
        }

        // Web Speech API：報讀語音 (指定台灣口音)
        function speakWord(text) {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 停止先前的語音
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'zh-TW'; // 嚴格指定台灣口音
                utterance.rate = 0.8;     // 稍微放慢速度以便聽寫
                window.speechSynthesis.speak(utterance);
            } else {
                alert('您的瀏覽器不支援語音合成功能');
            }
        }

        // 2. 註冊 Alpine.js 元件
        document.addEventListener('alpine:init', () => {
            Alpine.data('dictationApp', () => ({
                // === 狀態變數 (解決未定義錯誤，全部在此初始化) ===
                appMode: 'student', // 'student' 或 'teacher'
                
                // 課程資料狀態
                lessons: [], 
                isEditing: false,
                editingId: null,
                formData: { title: '', wordsRaw: '' },
                
                // 驗證相關狀態
                isAdminAuthenticated: false,
                showLoginModal: false,
                loginInput: '',
                loginError: false,
                adminPassword: 'admin', // 預設密碼，會被 Firebase 覆蓋
                showPasswordChangeModal: false,
                newPasswordInput: '',
                
                // 聽寫進行狀態
                isDictating: false,
                currentLesson: null,
                currentWords: [],
                currentWordIndex: 0,
                studentAnswer: '',

                // === 初始化 ===
                init() {
                    this.fetchLessons();
                    this.fetchAdminConfig();
                },

                // === Firebase 資料庫操作 ===
                fetchLessons() {
                    // 即時監聽 lessons 集合
                    onSnapshot(collection(db, "lessons"), (snapshot) => {
                        let fetchedLessons = [];
                        snapshot.forEach((doc) => {
                            fetchedLessons.push({ id: doc.id, ...doc.data() });
                        });
                        this.lessons = fetchedLessons;
                    }, (error) => {
                        console.error("讀取課文失敗:", error);
                        // 若無設定 Firebase，給予假資料測試用
                        if(this.lessons.length === 0) {
                            this.lessons = [{ id: 'test1', title: '範例課文(測試用)', words: ['蘋果', '香蕉', '橘子'] }];
                        }
                    });
                },

                fetchAdminConfig() {
                    // 即時監聽系統設定 (密碼)
                    onSnapshot(doc(db, "settings", "config"), (docSnapshot) => {
                        if (docSnapshot.exists()) {
                            this.adminPassword = docSnapshot.data().adminPassword || 'admin';
                        }
                    });
                },

                // === 老師/學生模式切換邏輯 ===
                toggleMode() {
                    if (this.appMode === 'student') {
                        if (!this.isAdminAuthenticated) {
                            this.loginInput = '';
                            this.loginError = false;
                            this.showLoginModal = true; // 彈出密碼框
                        } else {
                            this.appMode = 'teacher';
                        }
                    } else {
                        this.appMode = 'student';
                        this.resetForm();
                    }
                },

                verifyLogin() {
                    if (this.loginInput === this.adminPassword) {
                        this.isAdminAuthenticated = true;
                        this.showLoginModal = false;
                        this.appMode = 'teacher';
                    } else {
                        this.loginError = true;
                    }
                },

                async updatePassword() {
                    if (!this.newPasswordInput.trim()) {
                        alert('密碼不能為空！');
                        return;
                    }
                    try {
                        await setDoc(doc(db, "settings", "config"), {
                            adminPassword: this.newPasswordInput.trim()
                        }, { merge: true });
                        alert('密碼修改成功！');
                        this.showPasswordChangeModal = false;
                        this.newPasswordInput = '';
                    } catch (error) {
                        console.error("修改密碼失敗", error);
                        alert('修改失敗，請檢查權限或連線狀態。');
                    }
                },

                // === 老師管理功能 ===
                async saveLesson() {
                    if (!this.formData.title.trim() || !this.formData.wordsRaw.trim()) return;

                    // 將批次輸入的字串，利用正規表達式依據空白或換行切割成陣列，並去除空值
                    const wordsArray = this.formData.wordsRaw.split(/[\s\n]+/).filter(w => w.trim() !== '');

                    const lessonData = {
                        title: this.formData.title.trim(),
                        words: wordsArray
                    };

                    try {
                        if (this.isEditing) {
                            await updateDoc(doc(db, "lessons", this.editingId), lessonData);
                            alert('更新成功！');
                        } else {
                            await addDoc(collection(db, "lessons"), lessonData);
                            alert('新增成功！');
                        }
                        this.resetForm();
                    } catch (error) {
                        console.error("儲存失敗", error);
                        alert('儲存失敗，請確認 Firebase 設定。');
                    }
                },

                editLesson(lesson) {
                    this.isEditing = true;
                    this.editingId = lesson.id;
                    this.formData.title = lesson.title;
                    // 將陣列轉回換行字串，方便編輯
                    this.formData.wordsRaw = lesson.words.join('\n'); 
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                },

                async deleteLesson(id) {
                    if (confirm('確定要刪除這課嗎？')) {
                        try {
                            await deleteDoc(doc(db, "lessons", id));
                        } catch (error) {
                            console.error("刪除失敗", error);
                        }
                    }
                },

                resetForm() {
                    this.isEditing = false;
                    this.editingId = null;
                    this.formData = { title: '', wordsRaw: '' };
                },

                // === 學生聽寫功能 ===
                startDictation(lesson) {
                    if(lesson.words.length === 0) {
                        alert('這課沒有圈詞喔！');
                        return;
                    }
                    this.currentLesson = lesson;
                    // 複製一份詞彙陣列避免污染原資料
                    this.currentWords = [...lesson.words]; 
                    this.currentWordIndex = 0;
                    this.studentAnswer = '';
                    this.isDictating = true;
                    
                    // 延遲一點時間播放第一個字，讓畫面切換完畢
                    setTimeout(() => {
                        this.playWordAudio();
                    }, 500);
                },

                playWordAudio() {
                    speakWord(this.currentWords[this.currentWordIndex]);
                },

                checkAnswer() {
                    const correctAnswer = this.currentWords[this.currentWordIndex];
                    if (this.studentAnswer.trim() === correctAnswer) {
                        // 答對了
                        playSound('success');
                        
                        if (this.currentWordIndex < this.currentWords.length - 1) {
                            // 下一題
                            this.currentWordIndex++;
                            this.studentAnswer = '';
                            setTimeout(() => {
                                this.playWordAudio();
                            }, 800);
                        } else {
                            // 完成全部
                            alert(`太棒了！您完成了「${this.currentLesson.title}」的聽寫測驗！`);
                            this.endDictation();
                        }
                    } else {
                        // 答錯了
                        playSound('error');
                        alert('答錯囉，再聽一次試試看！\n提示：目前要寫的是「' + correctAnswer + '」');
                        this.studentAnswer = '';
                        this.playWordAudio();
                    }
                },

                endDictation() {
                    this.isDictating = false;
                    this.currentLesson = null;
                    this.currentWords = [];
                    this.studentAnswer = '';
                }
            }));
        });
    </script>
</body>
</html>
